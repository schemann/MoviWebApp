<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MovieApp{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="44" height="44">
        <span>MovieApp</span>
      </a>
      <nav class="site-nav">
        <a href="{{ url_for('index') }}">Users</a>
      </nav>
    </header>
    <main class="container">
      {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="notice {{ category }}">{{ message }}</p>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
    <script>
      // Disable the button and show a hint while a slow form (OMDb lookup) is sent.
      document.querySelectorAll("form[data-loading]").forEach(function (form) {
        form.addEventListener("submit", function () {
          var button = form.querySelector("button[type=submit]");
          if (button) {
            button.disabled = true;
            button.classList.add("loading");
            button.textContent = form.dataset.loading;
          }
        });
      });
    </script>
  </body>
</html>
