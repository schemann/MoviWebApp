<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MovieApp{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
    <link rel="preload" href="{{ url_for('static', filename='fonts/big-shoulders-display.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="40" height="40">
        <span>MovieApp</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Users</a>
      </nav>
    </header>
    <main id="main" class="container">
      {% block band %}{% endblock %}
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="notices" role="status">
        {% for category, message in messages %}
        <p class="notice {{ category }}">{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <script>
      // Disable the button and show a hint while a slow form (OMDb lookup) is sent.
      document.querySelectorAll("form[data-loading]").forEach(function (form) {
        form.addEventListener("submit", function () {
          var button = form.querySelector("button[type=submit]");
          if (button) {
            button.disabled = true;
            button.classList.add("loading");
            button.textContent = form.dataset.loading;
          }
        });
      });
    </script>
  </body>
</html>
